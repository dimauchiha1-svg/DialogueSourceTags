; DialogueSourceTags settings
; Adds a colored [PluginName] tag in front of every player response option in the dialogue menu,
; so you can see which plugin each line comes from.

[General]
; 1 = enabled, 0 = disabled
Enabled=1

; Which plugin counts as the source of a line:
;   Creator      - the plugin that created the line (recommended)
;   LastModifier - the last plugin that changed the line (the version actually in effect)
;   Both         - shows "[Creator>LastModifier]" when they differ
Source=Creator

; 1 = colored tags, 0 = tags in the normal text color.
UseColor=1

; 1 = do not tag lines from the official game files (Skyrim, Update, Dawnguard, HearthFires, Dragonborn),
; so only lines added by mods are marked.
HideOfficial=0

; 1 = "MyMod.esp", 0 = "MyMod"
ShowExtension=0

; Maximum tag length in characters (0 = no limit)
MaxTagLength=16

; 1 = write the first tagged lines to DialogueSourceTags.log (useful for checking that the mod works)
Log=1

; Custom colors, RRGGBB. Plugins that are not listed get an automatic color based on their file name.
; Official game files are grey by default.
[Colors]
;MyDialogueMod.esp=FFAA00
;AnotherMod.esp=55CCFF

; Custom short names for tags
[Names]
;MyDialogueMod.esp=MDM
